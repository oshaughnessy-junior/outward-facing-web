<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">From a claim to an inspectable record</title><desc id="desc">A scientific claim must link to a specific artifact and version; reviewers record scoped dispositions.</desc><rect width="960" height="440" rx="22" fill="#101f30"/><style>text{font-family:system-ui,sans-serif;fill:#edf4fa}.label{font-size:21px;font-weight:650}.small{font-size:16px;fill:#c8d7e5}</style><text x="42" y="52" font-size="26" font-weight="700">From a claim to an inspectable record</text><rect x="42" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="64" y="134">01</text><text class="label" x="64" y="176">State the claim</text><text class="small" x="64" y="220">What exactly is asserted?</text><text class="small" x="64" y="251">Which limits apply?</text><path d="M316 209h21m-7-7 7 7-7 7" stroke="#7cd4cd" stroke-width="3" fill="none"/><rect x="346" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="368" y="134">02</text><text class="label" x="368" y="176">Bind the evidence</text><text class="small" x="368" y="220">Identify the exact version</text><text class="small" x="368" y="251">Attach an inspectable record</text><path d="M620 209h21m-7-7 7 7-7 7" stroke="#7cd4cd" stroke-width="3" fill="none"/><rect x="650" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="672" y="134">03</text><text class="label" x="672" y="176">Scope the review</text><text class="small" x="672" y="220">Say what was checked</text><text class="small" x="672" y="251">Preserve unresolved questions</text><text class="small" x="42" y="384">A provenance record identifies evidence; it does not establish that the claim is true</text></svg>