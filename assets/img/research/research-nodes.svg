<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Small research nodes, shared evidence</title><desc id="desc">Parallel local agent nodes propose bounded experiments. Numerical results are collected and replayed before the next question.</desc><rect width="960" height="440" rx="22" fill="#101f30"/><style>text{font-family:system-ui,sans-serif;fill:#edf4fa}.label{font-size:21px;font-weight:650}.small{font-size:16px;fill:#c8d7e5}</style><text x="42" y="52" font-size="26" font-weight="700">Small research nodes, shared evidence</text><rect x="42" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="64" y="134">01</text><text class="label" x="64" y="176">Local research nodes</text><text class="small" x="64" y="220">Several bounded questions</text><text class="small" x="64" y="251">Local models + CPU work</text><path d="M316 209h21m-7-7 7 7-7 7" stroke="#7cd4cd" stroke-width="3" fill="none"/><rect x="346" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="368" y="134">02</text><text class="label" x="368" y="176">Collect the evidence</text><text class="small" x="368" y="220">Compare like with like</text><text class="small" x="368" y="251">Keep failures and provenance</text><path d="M620 209h21m-7-7 7 7-7 7" stroke="#7cd4cd" stroke-width="3" fill="none"/><rect x="650" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="672" y="134">03</text><text class="label" x="672" y="176">Check, then iterate</text><text class="small" x="672" y="220">Replay numerical results</text><text class="small" x="672" y="251">Choose the next question</text><text class="small" x="42" y="384">Research concept • no performance claim • scientific interpretation remains separate</text></svg>