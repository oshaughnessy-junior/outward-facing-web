<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">An experiment is more than a run</title><desc id="desc">A bounded design produces an executable simulation, then archived evidence informs the next design.</desc><rect width="960" height="440" rx="22" fill="#101f30"/><style>text{font-family:system-ui,sans-serif;fill:#edf4fa}.label{font-size:21px;font-weight:650}.small{font-size:16px;fill:#c8d7e5}</style><text x="42" y="52" font-size="26" font-weight="700">An experiment is more than a run</text><rect x="42" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="64" y="134">01</text><text class="label" x="64" y="176">Choose the experiment</text><text class="small" x="64" y="220">Specify the model and limits</text><text class="small" x="64" y="251">Record why this run matters</text><path d="M316 209h21m-7-7 7 7-7 7" stroke="#7cd4cd" stroke-width="3" fill="none"/><rect x="346" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="368" y="134">02</text><text class="label" x="368" y="176">Run and preserve</text><text class="small" x="368" y="220">Capture inputs and outputs</text><text class="small" x="368" y="251">Retain failures as evidence</text><path d="M620 209h21m-7-7 7 7-7 7" stroke="#7cd4cd" stroke-width="3" fill="none"/><rect x="650" y="99" width="268" height="230" rx="15" fill="#1a344a" stroke="#4b8eaa"/><text class="small" x="672" y="134">03</text><text class="label" x="672" y="176">Learn from the record</text><text class="small" x="672" y="220">Compare completed runs</text><text class="small" x="672" y="251">Refine the next experiment</text><text class="small" x="42" y="384">Conceptual illustration of the workflow described in this post; not measured data</text></svg>